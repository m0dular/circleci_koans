version: 2.1

# Define the jobs we want to run for this project
jobs:
  build:
    docker:
      - image: cimg/base:2023.03
    steps:
      - checkout
      - run: 
          name: Install sysstat
          command: |
            sudo apt-get update
            sudo apt-get install -y sysstat
            sudo /usr/lib/sysstat/sa1 --boot

      - run:
          name: Collect sa
          command: |
            while :; do
              /usr/lib/sysstat/sa1 1 1
              sleep 5m
            done
          background: true

      - run:
          name: Collect sar
          command: |
            while :; do
              S_COLORS=never sar -Az 1 1
              sleep 5m
            done
          background: true

      - run:
          name: Spin wheels
          no_output_timeout: 30m
          command: |
            sleep 15m


      - store_artifacts:
          path: /var/log/sysstat
# Orchestrate our job run sequence
workflows:
  build_and_test:
    jobs:
      - build
